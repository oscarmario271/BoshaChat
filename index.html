<!DOCTYPE html>
<html>
<head>
  <title>BoshaChat</title>
  <link href="https://fonts.googleapis.com/css?family=Fredoka+One" rel="stylesheet">
  <link rel="icon" type="image/png" href="res/BoshaChat.png">
  <style>
    body.dark {
      font-family: 'Segoe UI', 'Noto Sans', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background: #171717;
    }
    body.light {
      font-family: 'Segoe UI', 'Noto Sans', sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background: #EDEDED;
    }

    #sidebar {
	  font-family: 'Fredoka One', sans-serif;
      width: 260px;
	  min-width: 195px;
      background: #FF9500;
      color: #00A6FF;
      padding: 15px;

      overflow-y: auto;
      height: 100vh;
      box-sizing: border-box;
    }

    #sidebar h1 {
	  font-family: 'Fredoka One', sans-serif;
      margin-top: 0;
      font-size: 28px;
      color: #00A6FF;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
	  overflow-wrap: break-word;
	}

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }
	body.dark #messages {
	  color: #EDEDED;
	}
	body.light #messages {
	  color: #171717;
	}

    #inputArea {
      display: flex;
      padding: 10px;
      background: #00A6FF;
    }

    #inputArea input {
      flex: 1;
      padding: 8px;
	  border-radius: 10px;
    }
	body.dark #inputArea input {
	  background: #171717;
	  color: #EDEDED;
	}
	body.light #inputArea input {
	  background: #EDEDED;
	  color: #171717;
	}

    button {
	  font-family: 'Segoe UI', 'Noto Sans', sans-serif;
      border: 2px solid #00A6FF;
	  border-radius: 10px;
      padding: 8px 12px;
      margin: 5px 0;
      cursor: pointer;
    }
	body.dark button {
	  background: #171717;
      color: #EDEDED;
    }
	body.light button {
	  background: #EDEDED;
	  color: #171717;
	}

    #loginBox {
      margin: auto;
      text-align: center;
    }
	#sendButton {
	  border: 2px solid;
	  border-radius: 10px;
	}
	bosha {
		font-family: Comic Sans MS;
		color: #FF9500;
	}
	martin {
		color: green;
		font-family: Orbitron;
	}
	se {
		font-family: Helvetica;
		color: grey;
	}
	.message {
  position: relative;
  display: block;
  max-width: 70%;
  padding: 5px 7px;
  margin: 6px 0;
  border-radius: 18px;
}
body.dark .message {
  background: #00659C;
  color: #EDEDED;
}
body.light .message {
  background: #D8ECFF;
  color: #171717;
}

.message-time {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 6px;

  background: rgba(0, 0, 0, 0.85);
  color: white;
  font-size: 12px;
  padding: 2px 4px;
  border-radius: 8px;
  border: solid;
  border-color: #ff9500;

  white-space: nowrap;
  pointer-events: none;

  opacity: 0;
  transition: opacity 0.2s ease;
}

.message-sender {
  margin-bottom: 6px;
  color: #FF9500;
  font-weight: bold;
}

.message-line {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin: 2px 0;
}

.message-text {
  flex: 1;
}

.inline-time {
  font-size: 11px;
  color: #aaaaaa;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.message-line:hover .inline-time {
  opacity: 1;
}

body.dark #loginBox h2 {
  color: #EDEDED;
}

body.light #loginBox h2 {
  color: #171717;
}
.profile-image {
  height: 3.25em;
  width: auto;
  vertical-align: middle;
  background: transparent;
}
  </style>
</head>
<body class="dark">

<div id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<div id="app" style="display:none; width:100%;">

  <div id="sidebar">
    <h1>BoshaChat</h1>

    <button onclick="loadChat('global')">🌍 Global Chat</button>

    <hr>

    <button onclick="createDM()">➕ New DM</button>
    <div id="dmList"></div>

    <hr id="invites">

    <button onclick="createGroup()">👥 New Group</button>
    <div id="groupList"></div>

    <hr>
	
	<button onclick="openSettings()">⚙ Settings</button><br>
	<button onclick="BoshaGames()">🎮 BoshaGames</button>
	<button onclick="BoshaBot()">🤖 BoshaBot</button><br>
    <button onclick="logout()">Logout</button>
  </div>

  <div id="main">
    <div id="messages"></div>
	<div id="typingIndicator" style="padding:5px;color:gray;"></div>

    <div id="inputArea">
      <input id="messageInput" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth, signInWithEmailAndPassword, 
  onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { 
  getFirestore, collection, addDoc, onSnapshot, 
  query, orderBy, doc, setDoc, getDocs, 
  updateDoc, deleteDoc, getDoc, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { Base64 } from "https://cdn.jsdelivr.net/npm/js-base64@3.7.8/base64.mjs";

const firebaseConfig = {
  apiKey: "AIzaSyBqLckLS5qxKZ06S0fsbQS_mWPVFi4E00w",
  authDomain: "boshachat-acbbc.firebaseapp.com",
  projectId: "boshachat-acbbc",
  storageBucket: "boshachat-acbbc.firebasestorage.app",
  messagingSenderId: "732701616574",
  appId: "1:732701616574:web:abeb808acd5d5bbb3a71ef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentChatId = "global";
let unsubscribeMessages;
let unsubscribeTyping;
let currentDisplayName = "";
let userCache = {};

const loginBox = document.getElementById("loginBox");
const appDiv = document.getElementById("app");
const messagesDiv = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const hr = document.getElementById("invites");
const groupList = document.getElementById("groupList");
const dmList = document.getElementById("dmList");

const inviteSection = document.createElement("div");
inviteSection.innerHTML = "<hr><h3>📨 Invites</h3>";
document.getElementById("sidebar").insertBefore(inviteSection, hr);

/* ---------------- DISPLAY NAME SYSTEM ---------------- */

async function ensureUserProfile(user) {
  const ref = doc(db, "users", user.email);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    currentDisplayName = user.email.split("@")[0];

    await setDoc(ref, {
      displayName: currentDisplayName,
    });
  } else {
    currentDisplayName = snap.data().displayName;
  }
}

window.getDisplayName = async function(email) {
  const snap = await getDoc(doc(db, "users", email));
  return snap.exists() ? snap.data().displayName : email;
}

function watchUsers() {
  onSnapshot(collection(db, "users"), snapshot => {
    snapshot.forEach(docSnap => {
      userCache[docSnap.id] = {
		  displayName: docSnap.data().displayName,
		  profile: docSnap.data().profile || ""
	  };
    });
  });
}

/* ---------------- AUTH ---------------- */

window.login = function() {
  signInWithEmailAndPassword(
    auth,
    email.value,
    password.value
  ).catch(err => loginError.innerText = err.message);
}

window.logout = async function() {
  signOut(auth);
}

onAuthStateChanged(auth, async user => {
  if (user) {
    loginBox.style.display = "none";
    appDiv.style.display = "flex";

    await ensureGlobalExists();
    await ensureUserProfile(user);
	
	watchUsers();
    loadChat("global");
    loadChats();
    loadInvites();
	loadDarkMode();
  } else {
    loginBox.style.display = "block";
    appDiv.style.display = "none";
	document.body.className = "dark";
  }
});

/* ---------------- GLOBAL ---------------- */

async function ensureGlobalExists() {
  await setDoc(doc(db, "chats", "global"), 
    { type: "global" }, 
    { merge: true }
  );
}

/* ---------------- LOAD CHAT ---------------- */

function formatTimestamp(timestamp) {
  if (!timestamp) return "Sending...";

  let date;

  // Firestore Timestamp
  if (timestamp.toDate) {
    date = timestamp.toDate();
  }
  // Old Date.now() number
  else if (typeof timestamp === "number") {
    date = new Date(timestamp);
  }
  else {
    return "";
  }

return date.toLocaleString("en-GB", {
  weekday: "long",
  day: "numeric",
  month: "long",
  year: "numeric",
  hour: "2-digit",
  minute: "2-digit",
  hour12: true
});
}
	
window.loadChat = async function(chatId) {
  currentChatId = chatId;
  messagesDiv.innerHTML = "";

  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeTyping) unsubscribeTyping();

  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("timestamp")
  );

  const messageSound = new Audio("res/ping.mp3");

  unsubscribeMessages = onSnapshot(q, async snapshot => {
  messagesDiv.innerHTML = "";

let lastSender = null;
let currentBubble = null;
let currentMessagesContainer = null;

for (const docSnap of snapshot.docs) {
  const data = docSnap.data();

  const userData = userCache[data.user] || {};
  const name = userData.displayName || data.user.split("@")[0];
  const profile = userData.profile || "";

  // Create a new bubble if sender changed
  if (data.user !== lastSender) {
    currentBubble = document.createElement("div");
    currentBubble.className = "message";

	const profileImg = profile
      ? `${profile}`
      : "res/profile.png";
	  
    currentBubble.innerHTML = `
      <div class="message-sender"><h2><img src="${profileImg}" class="profile-image"> ${name}</h2></div>
      <div class="message-lines"></div>
    `;

    currentMessagesContainer =
      currentBubble.querySelector(".message-lines");

    messagesDiv.appendChild(currentBubble);

    lastSender = data.user;
  }

  // Add one message line to the current bubble
  const line = document.createElement("div");
  line.className = "message-line";

  line.innerHTML = `
    <span class="message-text">${data.text}</span>
    <span class="inline-time">${formatTimestamp(data.timestamp)}</span>
  `;

  currentMessagesContainer.appendChild(line);
};

  snapshot.docChanges().forEach(change => {

    if (change.type === "added") {
      const data = change.doc.data();

      if (data.user !== auth.currentUser.email) {
        messageSound.play();
      }

    }

  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

  watchTyping(chatId);
};

/* ---------------- LOAD CHATS ------------------ */

async function loadChats() {
  const snapshot = await getDocs(collection(db, "chats"));
  dmList.innerHTML = "";
  groupList.innerHTML = "";
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    if (!data.members || !data.members.includes(auth.currentUser.email)) return;
    if (data.type === "dm") {

  const otherUser = data.members.find(
    m => m !== auth.currentUser.email
  );

  const display =
    userCache[otherUser].displayName ||
    otherUser?.split("@")[0] ||
    "DM";

  const btn = document.createElement("button");
  btn.innerText = "💬 " + display;
  btn.onclick = () => loadChat(docSnap.id);

  dmList.appendChild(btn);
    }
    if (data.type === "group") {
      const btn = document.createElement("button");
      btn.innerText = "👥 " + data.name;
      btn.onclick = () => loadChat(docSnap.id);
      groupList.appendChild(btn);
    }
  });
}

/* ---------------- SEND MESSAGE ---------------- */

window.sendMessage = async function() {
  if (!messageInput.value) return;

  await addDoc(collection(db, "chats", currentChatId, "messages"), {
    user: auth.currentUser.email,
    text: messageInput.value,
    timestamp: serverTimestamp()
  });

  messageInput.value = "";
  stopTyping();
}

/* ---------------- TYPING SYSTEM ---------------- */

let typingTimeout;
const typingSound = new Audio("res/typing.mp3");

messageInput.addEventListener("input", async () => {
  if (!auth.currentUser) return;

  await setDoc(
    doc(db, "chats", currentChatId, "typing", auth.currentUser.email),
    { timestamp: Date.now() }
  );

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(stopTyping, 2000);
});

async function stopTyping() {
  try {
    await deleteDoc(
      doc(db, "chats", currentChatId, "typing", auth.currentUser.email)
    );
  } catch {}
}

function watchTyping(chatId) {
  const typingDiv = document.getElementById("typingIndicator");

  unsubscribeTyping = onSnapshot(
    collection(db, "chats", chatId, "typing"),
    snapshot => {

      let typingUsers = [];

      snapshot.forEach(docSnap => {
        if (docSnap.id !== auth.currentUser.email) {
          const name =
            userCache[docSnap.id].displayName ||
            docSnap.id.split("@")[0];

          typingUsers.push(name);
        }
      });

      if (typingUsers.length > 0) {
        typingDiv.innerHTML =
          `<i>${typingUsers.join(", ")} is typing...</i>`;
		  typingSound.play();
      } else {
        typingDiv.innerHTML = "";
		  typingSound.pause();
      }
    }
  );
}

/* ---------------- SETTINGS PANEL ---------------- */

window.openSettings = async function() {
  const snap = await getDoc(doc(db, "users", auth.currentUser.email));
  const darkMode = snap.data().darkMode;
  const checked = darkMode ? "checked" : "";
  currentChatId = "settingsPanel";
  messagesDiv.innerHTML = `
    <h2>⚙ Settings</h2>
    <button onclick="changeDisplayName()">Change Display Name</button><br><br>
	<span>Dark Mode</span><input type="checkbox" id="darkModeCheck" onclick="checkboxDarkMode()" ${checked} /><br><br>
	<h3>Profile Pic 🖼️*</h3><input type="file" id="profileChanger" accept="image/*" /><br><p>*Ask Oscar for help if needed.</p>
  `;

  setTimeout(() => {
    const profileChanger = document.getElementById("profileChanger");

    profileChanger.addEventListener("change", () => {
      const file = profileChanger.files[0];
      const reader = new FileReader();

      reader.onload = async () => {
        await updateDoc(doc(db, "users", auth.currentUser.email), {
          profile: reader.result
        });
      };

      reader.readAsDataURL(file);
    });
  }, 0);
}

window.changeDisplayName = async function() {
  const newName = prompt("Enter new display name:");
  if (!newName) return;

  await updateDoc(
    doc(db, "users", auth.currentUser.email),
    { displayName: newName }
  );

  alert("Updated!");
}
window.loadDarkMode = function() {onSnapshot(doc(db, "users", auth.currentUser.email), snapshot => {
		const data = snapshot.data();
		if (data.darkMode == true) {
			document.body.className = "dark";
		} else {
			document.body.className = "light";
		}
});
};
window.checkboxDarkMode = async function() {
	const checkbox = document.getElementById("darkModeCheck");
await updateDoc(
  doc(db, "users", auth.currentUser.email), {
    darkMode: checkbox.checked
  });
}
window.BoshaGames = function() {
	window.location.href = "/BoshaGames/hub/"
}
window.BoshaBot = function() {
	window.location.href = "/BoshaChat/AI/"
}

/* ---------------- INVITES / GROUPS / DMS ---------------- */
/* YOUR ORIGINAL LOGIC BELOW UNCHANGED */

window.createDM = async function() {
  const email = prompt("Enter email for DM:");
  if (!email) return;

  const chatRef = await addDoc(collection(db, "chats"), {
    type: "dm",
    members: [auth.currentUser.email]
  });

  await addDoc(collection(db, "invites"), {
    chatId: chatRef.id,
    from: auth.currentUser.email,
    to: email,
    type: "dm",
    status: "pending"
  });
};

window.createGroup = async function() {
  const name = prompt("Group name:");
  if (!name) return;

  const membersInput = prompt("Enter member emails separated by commas:");
  if (!membersInput) return;

  const chatRef = await addDoc(collection(db, "chats"), {
    type: "group",
    name,
    members: [auth.currentUser.email]
  });

  const members = membersInput.split(",").map(e => e.trim());

  for (const member of members) {
    await addDoc(collection(db, "invites"), {
      chatId: chatRef.id,
      from: auth.currentUser.email,
      to: member,
      type: "group",
      groupName: name,
      status: "pending"
    });
  }
};
function loadInvites() {
  onSnapshot(collection(db, "invites"), snapshot => {
    inviteSection.innerHTML = "<hr><h3>📨 Invites</h3>";

    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (data.to !== auth.currentUser.email || data.status !== "pending") return;

      const div = document.createElement("div");
      div.style.background = "white";
      div.style.padding = "5px";
      div.style.marginBottom = "5px";

      div.innerHTML = `
        <small>${data.type === "dm" ? "DM" : "Group"} from ${data.from}</small><br>
      `;

      const acceptBtn = document.createElement("button");
      acceptBtn.innerText = "Accept";
      acceptBtn.onclick = async () => {
        const chatRef = doc(db, "chats", data.chatId);
        const chatSnap = await getDocs(query(collection(db, "chats")));
        await updateDoc(chatRef, {
          members: [...new Set([... (chatSnap.docs.find(d => d.id === data.chatId).data().members), auth.currentUser.email])]
        });

        await deleteDoc(doc(db, "invites", docSnap.id));
        loadChats();
      };

      const declineBtn = document.createElement("button");
      declineBtn.innerText = "Decline";
      declineBtn.onclick = async () => {
        await deleteDoc(doc(db, "invites", docSnap.id));
      };

      div.appendChild(acceptBtn);
      div.appendChild(declineBtn);
      inviteSection.appendChild(div);
    });
  });
}
</script>

</body>
</html>
